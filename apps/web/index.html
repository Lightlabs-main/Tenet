<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenet — Collective investing, governed by rules</title>
    <meta name="description" content="Pool capital under an inspectable investment Mandate. Don't copy someone's trades. Fork their investment constitution." />
    <script>
      // Solana Kit needs WebCrypto, which browsers expose only in secure
      // contexts. The VPS preview's HTTP port (8503) must upgrade to the
      // canonical HTTPS origin before the application bundle can execute.
      if (location.protocol === "http:" && !window.isSecureContext) {
        const secureUrl = new URL(location.href);
        secureUrl.protocol = "https:";
        secureUrl.port = "";
        location.replace(secureUrl.href);
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Tenet — Collective investing, governed by rules" />
    <meta property="og:description" content="Pool money into tokenized stocks under an on-chain Mandate. Exit in kind anytime, or fork the rules." />
    <meta property="og:image" content="https://tenetstocks.website/tenet-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#111315" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        try {
          const choice = localStorage.getItem("tenet:theme");
          if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" role="status" aria-live="polite">
        <div class="boot-mark">T</div>
        <div>
          <strong>Loading Tenet</strong>
          <span>Connecting to Solana mainnet…</span>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const showBootError = (message) => {
          const root = document.getElementById("root");
          if (!root || root.dataset.mounted === "true") return;
          root.innerHTML = `<div id="boot-screen" role="alert"><div class="boot-mark boot-error">!</div><div><strong>Tenet could not start</strong><span>${String(message || "Refresh the page and try again.").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</span></div></div>`;
        };
        window.addEventListener("error", (event) => showBootError(event.error?.message || event.message));
        window.addEventListener("unhandledrejection", (event) => showBootError(event.reason?.message || event.reason));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
