[package]
name = "tenet"
version = "0.1.0"
description = "Collectively owned portfolios of tokenized stocks, governed by an on-chain investment constitution."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tenet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# V-016b: anchor-spl types used inside #[derive(Accounts)] REQUIRE their own
# idl-build feature, or IDL generation fails with missing DISCRIMINATOR /
# create_type / insert_types. pyth-solana-receiver-sdk has no idl-build feature.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# init-if-needed: upsert_registry_entry creates OR updates, gated on the
# registry authority, and never trusts prior contents it did not write.
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token_2022"] }
solana-instructions-sysvar = "3.0.1"
pyth-solana-receiver-sdk = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
serde_json = "1"
