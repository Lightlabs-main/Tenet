[package]
name = "tenet-program-tests"
version = "0.0.0"
edition = "2021"
publish = false

# On-chain behaviour tests, run in-process with LiteSVM against the real
# compiled target/deploy/tenet.so.
#
# A separate crate rather than dev-dependencies of programs/tenet on purpose:
# `anchor build` runs `cargo test` for IDL generation, which compiles
# dev-dependencies, so LiteSVM there would be rebuilt on every program build.

[dependencies]

[dev-dependencies]
litesvm = "0.16.0"
tenet = { path = "../../programs/tenet", features = ["no-entrypoint"] }
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token_2022"] }
solana-account = "4.3.2"
serde_json = "1"
base64 = "0.22"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.6"
solana-message = "4.4.1"
solana-instructions-sysvar = "3.0.1"
